openapi: 3.0.1
info:
  title: /
  version: 0.1.0
servers:
  - url: '{server}:{port}'
    variables:
      server:
        default: http://localhost
      port:
        default: '9090'
paths:
  /greeting:
    get:
      operationId: getGreeting
      responses:
        '200':
          description: Ok
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    wso2CloudApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      x-ballerina-name: apiKey
security:
  - wso2CloudApiKeyAuth: []
